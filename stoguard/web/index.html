<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stoguard</title>
  <script>
    (function () {
      try {
        var key = "stoguard.theme";
        var saved = localStorage.getItem(key);
        var theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark"></span>
        <div>
          <strong>Stoguard</strong>
          <small id="platform-label">loading…</small>
        </div>
      </div>
      <div class="tier-pill" id="tier-pill">Pro</div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark mode">Light mode</button>
      <nav>
        <button class="nav active" data-view="overview">Overview</button>
        <button class="nav" data-view="health" data-feature="health">Health</button>
        <button class="nav" data-view="doctor" data-feature="doctor">Workstation Doctor <span class="tier-badge">Pro</span></button>
        <button class="nav" data-view="ask" data-feature="ask">Ask Stoguard <span class="tier-badge">Pro</span></button>
        <button class="nav" data-view="learning" data-feature="learning">Learning Center</button>
        <button class="nav" data-view="automation" data-feature="automation">Automation <span class="tier-badge">Pro</span></button>
        <button class="nav" data-view="duplicates" data-feature="duplicates">Duplicates <span class="tier-badge">Pro</span></button>
        <button class="nav" data-view="aicleanup" data-feature="models">AI Cleanup <span class="tier-badge">Pro</span></button>
        <button class="nav" data-view="packages" data-feature="packages">Package Finder <span class="tier-badge">Pro</span></button>
        <button class="nav" data-view="media">Media Optimizer</button>
        <button class="nav" data-view="history">Storage Timeline</button>
        <button class="nav" data-view="items">All Findings</button>
        <button class="nav" data-view="fleet" data-feature="fleet_admin">Fleet <span class="tier-badge team">Team</span></button>
        <button class="nav" data-view="account">Pricing / Account</button>
      </nav>
      <div class="sidebar-foot">
        <button id="btn-scan" class="btn primary block">Smart Scan</button>
        <p class="hint">Smart Scan → Clean Selected → Trash / Recycle · no telemetry</p>
      </div>
    </aside>

    <main>
      <header class="top">
        <div>
          <h1 id="view-title">Overview</h1>
          <p id="view-sub">Find AI models, packages, and caches — with definitions and safe cleanup</p>
        </div>
        <div class="stats" id="hero-stats"></div>
      </header>

      <section id="view-overview" class="view active"></section>
      <section id="view-health" class="view"></section>
      <section id="view-doctor" class="view"></section>
      <section id="view-ask" class="view">
        <div class="chat">
          <div id="chat-log" class="chat-log"></div>
          <form id="chat-form" class="chat-form">
            <input id="chat-input" placeholder="Why is my disk full? Explain DerivedData. What’s my health score?" autocomplete="off" />
            <button class="btn primary" type="submit">Ask</button>
          </form>
        </div>
      </section>
      <section id="view-learning" class="view"></section>
      <section id="view-automation" class="view"></section>
      <section id="view-duplicates" class="view"></section>
      <section id="view-aicleanup" class="view"></section>
      <section id="view-packages" class="view"></section>
      <section id="view-media" class="view"></section>
      <section id="view-history" class="view"></section>
      <section id="view-items" class="view"></section>
      <section id="view-fleet" class="view"></section>
      <section id="view-account" class="view"></section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="notify" class="notify hidden" role="dialog" aria-modal="true" aria-labelledby="notify-title">
    <div class="notify-card">
      <h3 id="notify-title">Stoguard</h3>
      <p id="notify-body"></p>
      <div class="notify-actions" id="notify-actions"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
