name: Bug report
description: Report a crash, UI issue, or incorrect size display
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** include sensitive file paths or personal data.
        For safety issues (wrong delete label), see [SECURITY.md](../SECURITY.md).

  - type: input
    id: version
    attributes:
      label: VACS version
      placeholder: "0.1.0 (1) — from About screen"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.x"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
